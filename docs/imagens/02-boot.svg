<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">TP Aula 8 — Sequência de inicialização</text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#666">do POWER ON até a porta 5000 disponível, sem nenhum comando manual</text>

  <g font-size="12.5">
    <rect x="300" y="74" width="300" height="38" rx="5" fill="#1a1a1a"/>
    <text x="450" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">POWER ON</text>

    <rect x="300" y="132" width="300" height="42" rx="5" fill="#f2f2f2" stroke="#777"/>
    <text x="450" y="150" text-anchor="middle" font-weight="bold" fill="#1a1a1a">firmware da Raspberry</text>
    <text x="450" y="166" text-anchor="middle" font-size="11" fill="#555">lê a partição boot (vfat): config.txt, Image, dtb</text>

    <rect x="300" y="194" width="300" height="42" rx="5" fill="#eaf3ea" stroke="#3d6b3d"/>
    <text x="450" y="212" text-anchor="middle" font-weight="bold" fill="#1a1a1a">kernel Linux</text>
    <text x="450" y="228" text-anchor="middle" font-size="11" fill="#555">monta o rootfs ext4 da 2ª partição</text>

    <rect x="300" y="256" width="300" height="42" rx="5" fill="#eaf3ea" stroke="#3d6b3d"/>
    <text x="450" y="274" text-anchor="middle" font-weight="bold" fill="#1a1a1a">BusyBox init → /etc/init.d/rcS</text>
    <text x="450" y="290" text-anchor="middle" font-size="11" fill="#555">executa os scripts S?? em ordem</text>

    <rect x="300" y="318" width="300" height="38" rx="5" fill="#f5efe3" stroke="#8a6d3b"/>
    <text x="450" y="342" text-anchor="middle" font-weight="bold" fill="#1a1a1a">S40network — eth0 por DHCP</text>

    <rect x="300" y="376" width="300" height="38" rx="5" fill="#e8eff8" stroke="#2c5a8c"/>
    <text x="450" y="400" text-anchor="middle" font-weight="bold" fill="#1a1a1a">S60dockerd — sobe o dockerd</text>

    <rect x="300" y="434" width="300" height="104" rx="5" fill="#f3eef7" stroke="#6b4a82" stroke-width="1.6"/>
    <text x="450" y="454" text-anchor="middle" font-weight="bold" fill="#1a1a1a">S99flask-tp8 (nosso)</text>
    <text x="316" y="474" font-size="11" fill="#444">1. espera o "docker info" responder</text>
    <text x="316" y="492" font-size="11" fill="#444">2. docker load do tar embarcado (só no 1º boot)</text>
    <text x="316" y="510" font-size="11" fill="#444">3. docker run -p 5000:5000, ou docker start</text>
    <text x="316" y="528" font-size="11" fill="#444">4. container com --restart unless-stopped</text>

    <rect x="300" y="558" width="300" height="38" rx="5" fill="#1a6b3d"/>
    <text x="450" y="582" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">porta 5000 disponível na rede</text>
  </g>

  <g stroke="#555" stroke-width="1.6" marker-end="url(#b)">
    <line x1="450" y1="112" x2="450" y2="130"/>
    <line x1="450" y1="174" x2="450" y2="192"/>
    <line x1="450" y1="236" x2="450" y2="254"/>
    <line x1="450" y1="298" x2="450" y2="316"/>
    <line x1="450" y1="356" x2="450" y2="374"/>
    <line x1="450" y1="414" x2="450" y2="432"/>
    <line x1="450" y1="538" x2="450" y2="556"/>
  </g>

  <rect x="620" y="434" width="255" height="104" rx="5" fill="#fff8e6" stroke="#b8860b" stroke-width="1.3"/>
  <text x="634" y="455" font-size="11.5" font-weight="bold" fill="#8a6100">No 1º boot, tenha paciência</text>
  <text x="634" y="474" font-size="11" fill="#6b4c00">O init só abre o prompt de login</text>
  <text x="634" y="490" font-size="11" fill="#6b4c00">depois que o rcS termina. O docker</text>
  <text x="634" y="506" font-size="11" fill="#6b4c00">load de 48 MB leva 1 a 2 minutos:</text>
  <text x="634" y="522" font-size="11" fill="#6b4c00">a tela parece parada. Não desligue.</text>

  <rect x="25" y="318" width="255" height="96" rx="5" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
  <text x="39" y="339" font-size="11.5" font-weight="bold" fill="#333">Por que esta ordem</text>
  <text x="39" y="358" font-size="11" fill="#555">Os scripts rodam em ordem alfabética.</text>
  <text x="39" y="374" font-size="11" fill="#555">O número garante que a rede suba antes</text>
  <text x="39" y="390" font-size="11" fill="#555">do Docker, e o Docker antes do nosso</text>
  <text x="39" y="406" font-size="11" fill="#555">script, que depende dos dois.</text>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
</svg>
