<svg xmlns="http://www.w3.org/2000/svg" width="940" height="760" viewBox="0 0 940 760" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="940" height="760" fill="#ffffff"/>
  <text x="470" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">TP Aula 9 — Sequência de inicialização</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#666">do POWER ON até o dashboard no ar, sem nenhum comando manual</text>

  <g font-size="12.5">
    <rect x="320" y="74" width="300" height="36" rx="5" fill="#1a1a1a"/>
    <text x="470" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">POWER ON</text>

    <rect x="320" y="128" width="300" height="44" rx="5" fill="#f2f2f2" stroke="#777"/>
    <text x="470" y="146" text-anchor="middle" font-weight="bold" fill="#1a1a1a">firmware da Raspberry</text>
    <text x="470" y="162" text-anchor="middle" font-size="11" fill="#555">lê config.txt, Image, dtb e o overlay hcsr04.dtbo</text>

    <rect x="320" y="190" width="300" height="44" rx="5" fill="#eaf3ea" stroke="#3d6b3d"/>
    <text x="470" y="208" text-anchor="middle" font-weight="bold" fill="#1a1a1a">kernel Linux 6.12.61</text>
    <text x="470" y="224" text-anchor="middle" font-size="11" fill="#555">aplica o overlay e monta o rootfs ext4</text>

    <rect x="320" y="252" width="300" height="44" rx="5" fill="#eaf3ea" stroke="#3d6b3d"/>
    <text x="470" y="270" text-anchor="middle" font-weight="bold" fill="#1a1a1a">BusyBox init → /etc/init.d/rcS</text>
    <text x="470" y="286" text-anchor="middle" font-size="11" fill="#555">executa os scripts S?? em ordem alfabética</text>

    <rect x="320" y="314" width="300" height="48" rx="5" fill="#fdf1ec" stroke="#b4581f"/>
    <text x="470" y="332" text-anchor="middle" font-weight="bold" fill="#1a1a1a">S11modules</text>
    <text x="470" y="350" text-anchor="middle" font-size="11" fill="#555">modprobe brcmfmac e hcsr04 (modules-load.d)</text>

    <rect x="320" y="380" width="300" height="36" rx="5" fill="#f5efe3" stroke="#8a6d3b"/>
    <text x="470" y="403" text-anchor="middle" font-weight="bold" fill="#1a1a1a">S40network — interfaces "auto" (lo)</text>

    <rect x="320" y="434" width="300" height="48" rx="5" fill="#fdf1ec" stroke="#b4581f"/>
    <text x="470" y="452" text-anchor="middle" font-weight="bold" fill="#1a1a1a">S55hcsr04 (nosso)</text>
    <text x="470" y="470" text-anchor="middle" font-size="11" fill="#555">espera /dev/hcsr04 aparecer e faz chmod 666</text>

    <rect x="320" y="500" width="300" height="36" rx="5" fill="#e8eff8" stroke="#2c5a8c"/>
    <text x="470" y="523" text-anchor="middle" font-weight="bold" fill="#1a1a1a">S60dockerd — sobe o dockerd</text>

    <rect x="320" y="554" width="300" height="62" rx="5" fill="#eef4fb" stroke="#2c5a8c"/>
    <text x="470" y="572" text-anchor="middle" font-weight="bold" fill="#1a1a1a">S70tp-ap (nosso)</text>
    <text x="336" y="590" font-size="11" fill="#444">espera a wlan0 · IP 192.168.50.1/24</text>
    <text x="336" y="606" font-size="11" fill="#444">hostapd (SSID TP9-GRUPO03) · dnsmasq (DHCP)</text>

    <rect x="320" y="634" width="300" height="76" rx="5" fill="#f3eef7" stroke="#6b4a82" stroke-width="1.6"/>
    <text x="470" y="652" text-anchor="middle" font-weight="bold" fill="#1a1a1a">S99tp-app (nosso)</text>
    <text x="336" y="670" font-size="11" fill="#444">1. espera o "docker info"; segue mesmo sem o device</text>
    <text x="336" y="686" font-size="11" fill="#444">2. docker load do tar embarcado (só no 1º boot)</text>
    <text x="336" y="702" font-size="11" fill="#444">3. docker run --device /dev/hcsr04 -p 80:5000</text>

    <rect x="320" y="726" width="300" height="30" rx="5" fill="#1a6b3d"/>
    <text x="470" y="746" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">http://192.168.50.1 no ar</text>
  </g>

  <g stroke="#555" stroke-width="1.6" marker-end="url(#b)">
    <line x1="470" y1="110" x2="470" y2="126"/>
    <line x1="470" y1="172" x2="470" y2="188"/>
    <line x1="470" y1="234" x2="470" y2="250"/>
    <line x1="470" y1="296" x2="470" y2="312"/>
    <line x1="470" y1="362" x2="470" y2="378"/>
    <line x1="470" y1="416" x2="470" y2="432"/>
    <line x1="470" y1="482" x2="470" y2="498"/>
    <line x1="470" y1="536" x2="470" y2="552"/>
    <line x1="470" y1="616" x2="470" y2="632"/>
    <line x1="470" y1="710" x2="470" y2="724"/>
  </g>

  <rect x="650" y="314" width="270" height="118" rx="5" fill="#fdf8f4" stroke="#b4581f" stroke-width="1.3"/>
  <text x="664" y="335" font-size="11.5" font-weight="bold" fill="#8a4315">Por que o S11modules importa</text>
  <text x="664" y="354" font-size="11" fill="#6b3a12">A criação de dispositivos é devtmpfs</text>
  <text x="664" y="370" font-size="11" fill="#6b3a12">puro, sem mdev nem eudev: ninguém</text>
  <text x="664" y="386" font-size="11" fill="#6b3a12">trata o uevent e nada carrega módulo</text>
  <text x="664" y="402" font-size="11" fill="#6b3a12">sozinho. Sem esta linha não existiriam</text>
  <text x="664" y="418" font-size="11" fill="#6b3a12">nem a wlan0 nem o /dev/hcsr04.</text>

  <rect x="650" y="634" width="270" height="104" rx="5" fill="#fff8e6" stroke="#b8860b" stroke-width="1.3"/>
  <text x="664" y="655" font-size="11.5" font-weight="bold" fill="#8a6100">No 1º boot, tenha paciência</text>
  <text x="664" y="674" font-size="11" fill="#6b4c00">O init só abre o prompt de login</text>
  <text x="664" y="690" font-size="11" fill="#6b4c00">depois que o rcS termina. O docker</text>
  <text x="664" y="706" font-size="11" fill="#6b4c00">load de 48 MB leva 1 a 2 minutos:</text>
  <text x="664" y="722" font-size="11" fill="#6b4c00">a tela parece parada. Não desligue.</text>

  <rect x="20" y="352" width="270" height="62" rx="5" fill="#f5efe3" stroke="#8a6d3b" stroke-width="1.3"/>
  <text x="34" y="372" font-size="11.5" font-weight="bold" fill="#6b5223">S41eth0 — eth0 em segundo plano</text>
  <text x="34" y="390" font-size="11" fill="#6b5223">O ifup é síncrono: esperar o link aqui</text>
  <text x="34" y="406" font-size="11" fill="#6b5223">custaria até 15 s sem cabo.</text>
  <path d="M290 388 L306 388 L306 398 L318 398" fill="none" stroke="#8a6d3b" stroke-width="1.5" marker-end="url(#b)"/>

  <rect x="20" y="434" width="270" height="130" rx="5" fill="#f7f7f7" stroke="#999" stroke-width="1.2"/>
  <text x="34" y="455" font-size="11.5" font-weight="bold" fill="#333">Ordem e espera</text>
  <text x="34" y="474" font-size="11" fill="#555">Os scripts rodam em ordem alfabética,</text>
  <text x="34" y="490" font-size="11" fill="#555">e o número expressa a dependência.</text>
  <text x="34" y="510" font-size="11" fill="#555">Mas cada script ainda espera a condição</text>
  <text x="34" y="526" font-size="11" fill="#555">real de que depende — o device existir,</text>
  <text x="34" y="542" font-size="11" fill="#555">a wlan0 aparecer, o dockerd responder.</text>
  <text x="34" y="558" font-size="11" fill="#555">Numeração é intenção; espera é garantia.</text>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
</svg>
