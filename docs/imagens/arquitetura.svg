<svg xmlns="http://www.w3.org/2000/svg" width="980" height="700" viewBox="0 0 980 700" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="980" height="700" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">TP Aula 9 — Arquitetura do sistema</text>
  <text x="490" y="54" text-anchor="middle" font-size="12" fill="#666">Grupo G03 — HC-SR04 + Buildroot + Docker + Wi-Fi AP na Raspberry Pi 4</text>

  <!-- Sensor -->
  <rect x="24" y="120" width="210" height="124" rx="6" fill="#fdf1ec" stroke="#b4581f" stroke-width="1.5"/>
  <text x="129" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">HC-SR04</text>
  <text x="38" y="168" font-size="11" fill="#444">VCC 5 V · GND</text>
  <text x="38" y="186" font-size="11" fill="#444">TRIG → GPIO23 (pino 16)</text>
  <text x="38" y="204" font-size="11" fill="#444">ECHO → GPIO24 (pino 18)</text>
  <text x="38" y="226" font-size="11" font-weight="bold" fill="#b4581f">via divisor 1 kΩ / 2 kΩ</text>

  <!-- Cliente -->
  <rect x="24" y="430" width="210" height="130" rx="6" fill="#eef2f7" stroke="#4a6179" stroke-width="1.5"/>
  <text x="129" y="456" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Cliente</text>
  <text x="38" y="478" font-size="11" fill="#444">notebook ou celular</text>
  <text x="38" y="498" font-size="11" fill="#444">conectado ao SSID</text>
  <text x="38" y="516" font-size="11" font-weight="bold" fill="#1a1a1a">TP9-GRUPO03</text>
  <text x="38" y="536" font-size="11" fill="#444">recebe 192.168.50.x</text>
  <text x="38" y="552" font-size="11" fill="#444">por DHCP</text>

  <!-- Raspberry -->
  <rect x="280" y="90" width="672" height="580" rx="8" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="2"/>
  <text x="616" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Raspberry Pi 4 Model B — aarch64</text>
  <text x="616" y="131" text-anchor="middle" font-size="11" fill="#666">hostname rpi4-tp-g03 · eth0 por DHCP (administração) · wlan0 como Access Point</text>

  <!-- Linux -->
  <rect x="300" y="146" width="632" height="74" rx="5" fill="#eaf3ea" stroke="#3d6b3d" stroke-width="1.5"/>
  <text x="315" y="168" font-size="13" font-weight="bold" fill="#1a1a1a">Linux 6.12.61 / Buildroot 2026.08.1</text>
  <text x="315" y="187" font-size="11" fill="#444">BusyBox init (SysV) · rootfs ext4 1024M · devtmpfs puro (sem mdev/eudev)</text>
  <text x="315" y="205" font-size="11" fill="#444">namespaces · cgroups v2 · veth · bridge · netfilter/NAT · overlayfs · GPIOLIB · OF</text>

  <!-- Driver -->
  <rect x="300" y="234" width="632" height="76" rx="5" fill="#fdf1ec" stroke="#b4581f" stroke-width="1.5"/>
  <text x="315" y="256" font-size="13" font-weight="bold" fill="#1a1a1a">Driver hcsr04 (módulo deste projeto)</text>
  <text x="315" y="275" font-size="11" fill="#444">Device Tree: compatible "unisanta,hcsr04" · trig-gpios 23 · echo-gpios 24</text>
  <text x="315" y="291" font-size="11" fill="#444">mede por interrupção nas duas bordas do ECHO; prazo de 100 ms</text>
  <text x="315" y="306" font-size="11" font-weight="bold" fill="#b4581f">expõe /dev/hcsr04 — texto, em milímetros</text>

  <!-- Wi-Fi AP -->
  <rect x="300" y="324" width="632" height="70" rx="5" fill="#eef4fb" stroke="#2c5a8c" stroke-width="1.5"/>
  <text x="315" y="346" font-size="13" font-weight="bold" fill="#1a1a1a">Wi-Fi Access Point — wlan0 192.168.50.1/24</text>
  <text x="315" y="365" font-size="11" fill="#444">hostapd (nl80211, WPA2, canal 6) · dnsmasq entrega .10 a .100</text>
  <text x="315" y="382" font-size="11" fill="#444">brcmfmac + firmware do BCM43455 · sem NAT: a rede é isolada</text>

  <!-- Docker -->
  <rect x="300" y="408" width="632" height="58" rx="5" fill="#e8eff8" stroke="#2c5a8c" stroke-width="1.5"/>
  <text x="315" y="430" font-size="13" font-weight="bold" fill="#1a1a1a">Docker Engine 28.5.2</text>
  <text x="315" y="449" font-size="11" fill="#444">dockerd · containerd · runc · iptables publica a porta 80 (DNAT)</text>
  <text x="315" y="463" font-size="11" fill="#444">iniciado no boot por /etc/init.d/S60dockerd</text>

  <!-- bridge -->
  <rect x="300" y="480" width="632" height="44" rx="5" fill="#f5efe3" stroke="#8a6d3b" stroke-width="1.5"/>
  <text x="315" y="501" font-size="13" font-weight="bold" fill="#1a1a1a">bridge docker0 — 172.17.0.0/16</text>
  <text x="315" y="518" font-size="11" fill="#444">liga o container ao host por um par veth; não existe fora da placa</text>

  <!-- container -->
  <rect x="320" y="538" width="592" height="60" rx="5" fill="#f3eef7" stroke="#6b4a82" stroke-width="1.5"/>
  <text x="335" y="560" font-size="13" font-weight="bold" fill="#1a1a1a">Container tp-distance:1.0 (linux/arm64)</text>
  <text x="335" y="578" font-size="11" fill="#444">docker run -d --restart unless-stopped --device /dev/hcsr04 -p 80:5000</text>
  <text x="335" y="592" font-size="11" fill="#444">carregado de /opt/docker/tp-distance.tar no 1º boot</text>

  <!-- flask -->
  <rect x="340" y="610" width="552" height="48" rx="5" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  <text x="355" y="631" font-size="13" font-weight="bold" fill="#1a1a1a">Python 3.12 + Flask 3.1.3 — 0.0.0.0:5000</text>
  <text x="355" y="649" font-size="11" fill="#444">GET /api/distance → JSON · GET / → dashboard, atualiza a cada 500 ms</text>

  <!-- setas internas -->
  <line x1="616" y1="220" x2="616" y2="234" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="616" y1="466" x2="616" y2="480" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="616" y1="524" x2="616" y2="538" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="616" y1="598" x2="616" y2="610" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- sensor -> driver -->
  <path d="M234 182 L258 182 L258 272 L300 272" fill="none" stroke="#b4581f" stroke-width="1.8" marker-end="url(#b)"/>
  <text x="129" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#b4581f">pulso elétrico →</text>

  <!-- /dev/hcsr04 -> container -->
  <path d="M932 272 L958 272 L958 568 L912 568" fill="none" stroke="#b4581f" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#b)"/>
  <text x="966" y="420" font-size="11" font-weight="bold" fill="#b4581f" transform="rotate(90 966 420)">--device leva o /dev/hcsr04 para dentro</text>

  <!-- cliente -> AP -->
  <path d="M234 470 L270 470 L270 358 L300 358" fill="none" stroke="#2c5a8c" stroke-width="1.8" marker-end="url(#c)"/>
  <text x="24" y="596" font-size="11" font-weight="bold" fill="#2c5a8c">Caminho do pacote</text>
  <text x="24" y="614" font-size="10" fill="#2c5a8c">O cliente abre http://192.168.50.1</text>
  <text x="24" y="629" font-size="10" fill="#2c5a8c">pela wlan0. O iptables do Docker</text>
  <text x="24" y="644" font-size="10" fill="#2c5a8c">reescreve o destino (DNAT) da porta</text>
  <text x="24" y="659" font-size="10" fill="#2c5a8c">80 para 172.17.0.x:5000, e ele segue</text>
  <text x="24" y="674" font-size="10" fill="#2c5a8c">pela docker0 até o container.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4581f"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c5a8c"/>
    </marker>
  </defs>
</svg>
