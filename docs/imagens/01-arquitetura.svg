<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">TP Aula 8 — Arquitetura do sistema</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#666">Grupo G03 — Buildroot + Docker + Flask na Raspberry Pi 4</text>

  <!-- Notebook -->
  <rect x="30" y="100" width="190" height="90" rx="6" fill="#eef2f7" stroke="#4a6179" stroke-width="1.5"/>
  <text x="125" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Notebook</text>
  <text x="125" y="150" text-anchor="middle" font-size="12" fill="#444">navegador</text>
  <text x="125" y="172" text-anchor="middle" font-size="11" fill="#666">mesma rede local</text>

  <!-- seta HTTP -->
  <line x1="220" y1="145" x2="300" y2="145" stroke="#c0392b" stroke-width="2" marker-end="url(#a)"/>
  <text x="260" y="136" text-anchor="middle" font-size="11" fill="#c0392b">HTTP</text>
  <text x="260" y="162" text-anchor="middle" font-size="11" fill="#c0392b">:5000</text>

  <!-- Raspberry -->
  <rect x="300" y="80" width="570" height="440" rx="8" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="2"/>
  <text x="585" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Raspberry Pi 4 Model B — aarch64</text>
  <text x="585" y="121" text-anchor="middle" font-size="11" fill="#666">hostname rpi4-tp8-g03 · eth0 por DHCP</text>

  <!-- Linux -->
  <rect x="320" y="136" width="530" height="66" rx="5" fill="#eaf3ea" stroke="#3d6b3d" stroke-width="1.5"/>
  <text x="335" y="158" font-size="13" font-weight="bold" fill="#1a1a1a">Linux / Buildroot 2026.08.1</text>
  <text x="335" y="177" font-size="11" fill="#444">kernel bcm2711 + fragment de containers · BusyBox init (SysV) · rootfs ext4 1024M</text>
  <text x="335" y="193" font-size="11" fill="#444">namespaces · cgroups v2 · veth · bridge · netfilter/NAT · overlayfs</text>

  <!-- Docker Engine -->
  <rect x="320" y="216" width="530" height="62" rx="5" fill="#e8eff8" stroke="#2c5a8c" stroke-width="1.5"/>
  <text x="335" y="238" font-size="13" font-weight="bold" fill="#1a1a1a">Docker Engine 28.5.2</text>
  <text x="335" y="257" font-size="11" fill="#444">dockerd · containerd · runc · iptables (NAT publica a porta)</text>
  <text x="335" y="272" font-size="11" fill="#444">iniciado no boot por /etc/init.d/S60dockerd</text>

  <!-- bridge -->
  <rect x="320" y="292" width="530" height="46" rx="5" fill="#f5efe3" stroke="#8a6d3b" stroke-width="1.5"/>
  <text x="335" y="313" font-size="13" font-weight="bold" fill="#1a1a1a">bridge docker0 — 172.17.0.0/16</text>
  <text x="335" y="330" font-size="11" fill="#444">rede padrão criada pelo dockerd; liga o container ao host por um par veth</text>

  <!-- container -->
  <rect x="340" y="352" width="490" height="76" rx="5" fill="#f3eef7" stroke="#6b4a82" stroke-width="1.5"/>
  <text x="355" y="374" font-size="13" font-weight="bold" fill="#1a1a1a">Container flask-tp8 (linux/arm64)</text>
  <text x="355" y="393" font-size="11" fill="#444">IP interno 172.17.0.x · porta 5000 do container</text>
  <text x="355" y="409" font-size="11" fill="#444">docker run -d --restart unless-stopped -p 5000:5000</text>
  <text x="355" y="423" font-size="11" fill="#444">carregado de /opt/docker/flask-tp8.tar no 1º boot</text>

  <!-- flask -->
  <rect x="360" y="442" width="450" height="58" rx="5" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  <text x="375" y="464" font-size="13" font-weight="bold" fill="#1a1a1a">Python 3.12 + Flask 3.1.3</text>
  <text x="375" y="482" font-size="11" fill="#444">app.run(host="0.0.0.0", port=5000)</text>
  <text x="375" y="496" font-size="11" fill="#444">GET / → "Helooowww world eng. Computacional!!!!!!!"</text>

  <!-- setas internas -->
  <line x1="585" y1="202" x2="585" y2="216" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="585" y1="278" x2="585" y2="292" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="585" y1="338" x2="585" y2="352" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="585" y1="428" x2="585" y2="442" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- caminho do pacote -->
  <path d="M300 145 L286 145 L286 320 L320 320" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="34" y="368" font-size="11" font-weight="bold" fill="#c0392b">Caminho do pacote</text>
  <text x="34" y="388" font-size="11" fill="#c0392b">Chega pela eth0 na porta 5000</text>
  <text x="34" y="404" font-size="11" fill="#c0392b">do host. O iptables do Docker</text>
  <text x="34" y="420" font-size="11" fill="#c0392b">o reescreve (DNAT) para</text>
  <text x="34" y="436" font-size="11" fill="#c0392b">172.17.0.x:5000 e ele segue</text>
  <text x="34" y="452" font-size="11" fill="#c0392b">pela docker0 até o container.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
</svg>
