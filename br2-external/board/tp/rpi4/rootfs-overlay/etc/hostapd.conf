# =====================================================================
#  hostapd — Access Point do TP 9 (guia Aula 12, seção 13.2)
# =====================================================================
#  Quem inicia: /etc/init.d/S70tp-ap, depois de a wlan0 existir e receber
#  o IP estático. O pacote hostapd do Buildroot instala um hostapd.conf de
#  exemplo em /etc; este arquivo vem do rootfs-overlay, que é copiado DEPOIS
#  dos pacotes, então é este que fica na imagem.
#
#  O SSID é cobrado pelo checklist de avaliação (seção 17 do enunciado) e por
#  isso mantém o número do TP, ao contrário do resto da nomenclatura.
# =====================================================================

interface=wlan0
driver=nl80211

ssid=TP9-GRUPO03
hw_mode=g
channel=6

# WPA2-PSK apenas. auth_algs=1 é "Open System": sem ele o hostapd também
# aceitaria WEP Shared Key, que não faz sentido junto com WPA2.
auth_algs=1
wpa=2
wpa_passphrase=embarcados2026
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# Permite usar o hostapd_cli (instalado pelo pacote em /usr/bin) na
# apresentação: "hostapd_cli all_sta" lista os clientes associados, o que serve
# de evidência de que o celular realmente entrou na rede.
ctrl_interface=/var/run/hostapd

# country_code NÃO está definido de propósito. O brcmfmac gerencia o domínio
# regulatório por conta própria (CLM embutido no firmware), e um country_code
# que o driver recuse faz o hostapd abortar na inicialização. O canal 6 em
# 2,4 GHz é permitido em qualquer domínio. O wireless-regdb está na imagem
# (/lib/firmware/regulatory.db), então, se no dia a potência ou o canal
# precisarem de ajuste, basta acrescentar "country_code=BR" e "ieee80211d=1".
