# =====================================================================
#  dnsmasq — DHCP da rede do AP (guia Aula 12, seção 13.3)
# =====================================================================
#  Quem inicia: /etc/init.d/S70tp-ap, junto com o hostapd. O script
#  S80dnsmasq que o pacote instala é removido pelo post-build.sh do TP, para
#  que o AP tenha uma única sequência de inicialização — o próprio guia manda
#  desabilitar scripts duplicados.
#
#  A faixa e o IP são cobrados pelo enunciado e não podem mudar.
# =====================================================================

interface=wlan0

# bind-dynamic em vez do bind-interfaces do guia: o bind-interfaces exige que a
# interface já exista e tenha endereço no momento em que o dnsmasq sobe, e
# falha de forma definitiva se não existir. O bind-dynamic acompanha a
# interface aparecendo ou trocando de endereço, o que é mais seguro num boot em
# que a wlan0 depende do firmware carregar.
bind-dynamic

dhcp-range=192.168.50.10,192.168.50.100,255.255.255.0,12h
dhcp-option=3,192.168.50.1
dhcp-option=6,192.168.50.1

# Único servidor DHCP da rede: responde de imediato a cliente que peça um
# endereço antigo de outra rede, em vez de esperar o lease expirar.
dhcp-authoritative

# Registra no syslog cada oferta e cada concessão. É o que permite mostrar, em
# /var/log/messages, o endereço que o celular recebeu.
log-dhcp
