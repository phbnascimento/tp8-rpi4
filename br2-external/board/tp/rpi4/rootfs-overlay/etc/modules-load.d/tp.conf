# Módulos que o S11modules carrega no boot (modprobe de /etc/modules-load.d/*.conf).
#
# brcmfmac é o driver do Wi-Fi onboard da Pi 4 e vem como MÓDULO no kernel do
# projeto. A criação de dispositivos é devtmpfs puro, sem mdev nem eudev, então
# ninguém trata o uevent do SDIO e nada carrega o módulo sozinho: sem esta linha
# a wlan0 nunca aparece e o hostapd não tem interface para usar. O guia não
# menciona isso.
#
# As dependências (cfg80211, mac80211, brcmutil) vêm pelo modprobe. O submódulo
# de fabricante é carregado pelo próprio brcmfmac via request_module, que chama
# /sbin/modprobe e funciona sem udev. Para o 43455 da Pi 4 é o brcmfmac-wcc,
# conforme a tabela SDIO do driver (BRCMF_SDIO_DEVICE(..._43455, WCC) em
# bcmsdh.c) — não o brcmfmac-cyw, apesar de o firmware vir do diretório
# cypress/ do linux-firmware.
brcmfmac

# hcsr04 é o driver do sensor ultrassônico, deste projeto. Mesmo motivo do
# brcmfmac: é módulo, e sem alguém pedindo o modprobe o /dev/hcsr04 não existe.
# O S55hcsr04 espera o device aparecer e abre a permissão.
hcsr04
